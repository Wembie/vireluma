# Creates the Git tag and GitHub Release for the version in VERSION.
#
# Runs automatically at the end of deploy-pages.yml, after the production
# deployment is verified live. It is idempotent and version-driven, not
# commit-driven: if tag v<VERSION> already exists, nothing is released. A new
# release therefore happens only when a PR bumps VERSION and dates its
# CHANGELOG section. It can also be run manually on main to backfill a release.
name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Decide whether this version needs a release
        id: version
        run: |
          version=$(node scripts/version.mjs current)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists — nothing to release (bump VERSION to release)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/version.mjs check --release
          node scripts/version.mjs notes > release-notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Require a successful production deploy of this commit
        if: steps.version.outputs.release == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh run list --workflow deploy-pages.yml --commit "$GITHUB_SHA" --json conclusion --jq '.[0].conclusion')
          if [ "$status" != "success" ]; then
            echo "::error::No successful Pages deployment for ${GITHUB_SHA} (got '${status}')"; exit 1
          fi

      - name: Append deployment metadata
        if: steps.version.outputs.release == 'true'
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://wembie.github.io' }}${{ vars.PUBLIC_BASE_PATH || '/vireluma' }}/
        run: |
          {
            echo
            echo '---'
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployed site: ${SITE_URL}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> release-notes.md

      - name: Create tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --title "VIRELUMA $tag" --notes-file release-notes.md --verify-tag --latest
